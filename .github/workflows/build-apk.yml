name: Build VTTS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VTTS Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # JAVA 17
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # ANDROID SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # --------------------------------------------------
      # DOWNLOAD SHERPA-ONNX AAR
      # --------------------------------------------------

      - name: Download sherpa-onnx 1.13.7
        shell: bash
        run: |
          set -e

          mkdir -p app/libs

          AAR_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar"

          echo "Downloading sherpa-onnx..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 1800 \
            -o app/libs/sherpa-onnx-1.13.7.aar \
            "$AAR_URL"

          if [ ! -s app/libs/sherpa-onnx-1.13.7.aar ]; then
            echo "ERROR: sherpa-onnx AAR download failed."
            exit 1
          fi

          echo "sherpa-onnx downloaded successfully."

          ls -lh app/libs/sherpa-onnx-1.13.7.aar


      # --------------------------------------------------
      # DOWNLOAD SUPERTONIC-3 INT8 MODEL
      # --------------------------------------------------

      - name: Download Supertonic-3 INT8 model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/supertonic"

          mkdir -p "$MODEL_DIR"

          BASE_URL="https://github.com/vishala5000/vtts/releases/download/vtts"

          files=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          for file in "${files[@]}"; do

            echo ""
            echo "========================================"
            echo "Downloading: $file"
            echo "========================================"

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 1800 \
              -o "$MODEL_DIR/$file" \
              "$BASE_URL/$file"

            if [ ! -f "$MODEL_DIR/$file" ]; then
              echo "ERROR: File was not downloaded: $file"
              exit 1
            fi

            if [ ! -s "$MODEL_DIR/$file" ]; then
              echo "ERROR: File is empty: $file"
              exit 1
            fi

            echo "Downloaded successfully:"
            ls -lh "$MODEL_DIR/$file"

          done


      # --------------------------------------------------
      # VERIFY MODEL
      # --------------------------------------------------

      - name: Verify Supertonic model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/supertonic"

          required=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          echo ""
          echo "========================================"
          echo "VERIFYING SUPERTONIC MODEL"
          echo "========================================"

          for file in "${required[@]}"; do

            path="$MODEL_DIR/$file"

            if [ ! -f "$path" ]; then
              echo "ERROR: Missing model file:"
              echo "$path"
              exit 1
            fi

            if [ ! -s "$path" ]; then
              echo "ERROR: Empty model file:"
              echo "$path"
              exit 1
            fi

            echo "OK: $file"

          done

          echo ""
          echo "All Supertonic model files verified."


      # --------------------------------------------------
      # VERIFY AAR
      # --------------------------------------------------

      - name: Verify sherpa-onnx AAR
        shell: bash
        run: |
          set -e

          if [ ! -f "app/libs/sherpa-onnx-1.13.7.aar" ]; then
            echo "ERROR: sherpa-onnx AAR not found."
            exit 1
          fi

          if [ ! -s "app/libs/sherpa-onnx-1.13.7.aar" ]; then
            echo "ERROR: sherpa-onnx AAR is empty."
            exit 1
          fi

          echo "AAR verified successfully."

          ls -lh app/libs/sherpa-onnx-1.13.7.aar


      # --------------------------------------------------
      # SHOW PROJECT
      # --------------------------------------------------

      - name: Show project files
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find app/src/main \
            -type f \
            -print \
            | sort

          echo ""
          echo "========================================"
          echo "LIBRARY FILES"
          echo "========================================"

          find app/libs \
            -type f \
            -exec ls -lh {} \;


      # --------------------------------------------------
      # CLEAN
      # --------------------------------------------------

      - name: Clean Gradle project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean


      # --------------------------------------------------
      # BUILD DEBUG
      # --------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug


      # --------------------------------------------------
      # INSPECT DEBUG
      # --------------------------------------------------

      - name: Inspect debug build
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "DEBUG BUILD OUTPUT"
          echo "========================================"

          if [ -d "app/build" ]; then

            find app/build \
              -type f \
              -name "*.apk" \
              -print \
              || true

            echo ""
            echo "All output files:"

            find app/build/outputs \
              -type f \
              -print \
              2>/dev/null \
              || true

          else

            echo "app/build does not exist."

          fi


      # --------------------------------------------------
      # VERIFY DEBUG APK
      # --------------------------------------------------

      - name: Verify debug APK
        shell: bash
        run: |
          set -e

          DEBUG_APK=""

          while IFS= read -r file; do

            if [[ "$file" == *debug*.apk ]]; then
              DEBUG_APK="$file"
              break
            fi

          done < <(
            find app/build \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$DEBUG_APK" ]; then

            echo ""
            echo "ERROR: DEBUG APK WAS NOT GENERATED."

            echo ""
            echo "Gradle build directory:"

            find app/build \
              -maxdepth 10 \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo ""
          echo "DEBUG APK FOUND:"
          echo "$DEBUG_APK"

          ls -lh "$DEBUG_APK"


      # --------------------------------------------------
      # BUILD RELEASE
      # --------------------------------------------------

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleRelease


      # --------------------------------------------------
      # INSPECT RELEASE
      # --------------------------------------------------

      - name: Inspect release build
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "RELEASE BUILD OUTPUT"
          echo "========================================"

          if [ -d "app/build" ]; then

            find app/build \
              -type f \
              -name "*.apk" \
              -print \
              || true

          else

            echo "app/build does not exist."

          fi


      # --------------------------------------------------
      # VERIFY RELEASE APK
      # --------------------------------------------------

      - name: Verify release APK
        shell: bash
        run: |
          set -e

          RELEASE_APK=""

          while IFS= read -r file; do

            if [[ "$file" == *release*.apk ]]; then
              RELEASE_APK="$file"
              break
            fi

          done < <(
            find app/build \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ -z "$RELEASE_APK" ]; then

            echo ""
            echo "ERROR: RELEASE APK WAS NOT GENERATED."

            echo ""
            echo "Gradle build directory:"

            find app/build \
              -maxdepth 10 \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo ""
          echo "RELEASE APK FOUND:"
          echo "$RELEASE_APK"

          ls -lh "$RELEASE_APK"


      # --------------------------------------------------
      # FINAL APK LIST
      # --------------------------------------------------

      - name: List final APKs
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "FINAL APK FILES"
          echo "========================================"

          find app/build \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # --------------------------------------------------
      # UPLOAD DEBUG APK
      # --------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-debug
          path: |
            app/build/outputs/**/*.apk
          if-no-files-found: error


      # --------------------------------------------------
      # UPLOAD RELEASE APK
      # --------------------------------------------------

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-release
          path: |
            app/build/outputs/**/*.apk
          if-no-files-found: error

