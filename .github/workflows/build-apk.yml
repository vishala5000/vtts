name: Build VTTS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # --------------------------------------------------
      # Checkout source
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Java 17
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # Android SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # Install Android SDK components
      # --------------------------------------------------

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # Setup Gradle
      # --------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # --------------------------------------------------
      # Create AAR directory
      # --------------------------------------------------

      - name: Prepare sherpa-onnx
        shell: bash
        run: |
          mkdir -p app/libs

          curl -L --fail \
            --retry 5 \
            --retry-delay 3 \
            -o app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar

          ls -lh app/libs/

      # --------------------------------------------------
      # Download your model files from your vtts release
      # --------------------------------------------------

      - name: Download Supertonic-3 model
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |

          mkdir -p app/src/main/assets/supertonic

          BASE_URL="https://github.com/${REPO}/releases/download/vtts"

          files=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          for file in "${files[@]}"; do

            echo "=========================================="
            echo "Downloading: ${file}"
            echo "=========================================="

            curl -L --fail \
              --retry 5 \
              --retry-delay 3 \
              -o "app/src/main/assets/supertonic/${file}" \
              "${BASE_URL}/${file}"

          done

          echo
          echo "Downloaded model files:"
          ls -lh app/src/main/assets/supertonic/

      # --------------------------------------------------
      # Verify model files
      # --------------------------------------------------

      - name: Verify model
        shell: bash
        run: |

          required=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          for file in "${required[@]}"; do

            path="app/src/main/assets/supertonic/${file}"

            if [ ! -s "$path" ]; then
              echo "ERROR: Missing or empty file:"
              echo "$path"
              exit 1
            fi

          done

          echo "All Supertonic model files verified."

      # --------------------------------------------------
      # Show project
      # --------------------------------------------------

      - name: Show project
        run: |
          find . -maxdepth 5 -type f | sort

      # --------------------------------------------------
      # Build debug APK
      # --------------------------------------------------

      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # --------------------------------------------------
      # Build release APK
      # --------------------------------------------------

      - name: Build release APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # --------------------------------------------------
      # Find APKs
      # --------------------------------------------------

      - name: List APKs
        run: |
          echo "=========================================="
          echo "DEBUG APK"
          echo "=========================================="

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo
          echo "=========================================="
          echo "RELEASE APK"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

      # --------------------------------------------------
      # Upload debug APK
      # --------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # Upload release APK
      # --------------------------------------------------

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
