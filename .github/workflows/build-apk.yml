name: Build VTTS APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VTTS Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"


      # ============================================================
      # DOWNLOAD SHERPA-ONNX AAR
      # ============================================================

      - name: Download sherpa-onnx Android AAR
        shell: bash
        run: |
          mkdir -p app/libs

          echo "Downloading sherpa-onnx 1.13.7..."

          curl -L --fail \
            --retry 5 \
            --retry-delay 3 \
            -o app/libs/sherpa-onnx-1.13.7.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar

          echo
          echo "AAR:"
          ls -lh app/libs/sherpa-onnx-1.13.7.aar


      # ============================================================
      # DOWNLOAD YOUR SUPERTONIC-3 RELEASE
      #
      # YOUR RELEASE:
      # https://github.com/vishala5000/vtts/releases/tag/vtts
      # ============================================================

      - name: Download Supertonic-3 INT8 model
        shell: bash
        run: |

          mkdir -p app/src/main/assets/supertonic

          BASE_URL="https://github.com/vishala5000/vtts/releases/download/vtts"

          echo "=============================================="
          echo "Downloading Supertonic-3 model"
          echo "Release: vtts"
          echo "Repository: vishala5000/vtts"
          echo "=============================================="

          files=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          for file in "${files[@]}"; do

            echo
            echo "----------------------------------------------"
            echo "Downloading:"
            echo "$file"
            echo "----------------------------------------------"

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 900 \
              -o "app/src/main/assets/supertonic/$file" \
              "$BASE_URL/$file"

            if [ ! -s "app/src/main/assets/supertonic/$file" ]; then
              echo "ERROR: Downloaded file is missing or empty:"
              echo "$file"
              exit 1
            fi

          done


      # ============================================================
      # VERIFY MODEL
      # ============================================================

      - name: Verify Supertonic model
        shell: bash
        run: |

          echo
          echo "=============================================="
          echo "VERIFYING SUPERTONIC MODEL"
          echo "=============================================="

          required=(
            "duration_predictor.int8.onnx"
            "text_encoder.int8.onnx"
            "vector_estimator.int8.onnx"
            "vocoder.int8.onnx"
            "tts.json"
            "unicode_indexer.bin"
            "voice.bin"
          )

          for file in "${required[@]}"; do

            path="app/src/main/assets/supertonic/$file"

            if [ ! -s "$path" ]; then
              echo
              echo "ERROR:"
              echo "$path"
              echo "is missing or empty."
              exit 1
            fi

            echo "OK: $file"
            ls -lh "$path"

          done

          echo
          echo "All Supertonic model files verified."


      # ============================================================
      # SHOW FILES
      # ============================================================

      - name: Show project files
        shell: bash
        run: |

          echo
          echo "=============================================="
          echo "PROJECT FILES"
          echo "=============================================="

          find . -maxdepth 8 -type f | sort


      # ============================================================
      # BUILD DEBUG APK
      # ============================================================

      - name: Build debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build release APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease


      # ============================================================
      # SHOW APK
      # ============================================================

      - name: List generated APKs
        shell: bash
        run: |

          echo
          echo "=============================================="
          echo "DEBUG APK"
          echo "=============================================="

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo
          echo "=============================================="
          echo "RELEASE APK"
          echo "=============================================="

          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # ============================================================
      # UPLOAD DEBUG APK
      # ============================================================

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # UPLOAD RELEASE APK
      # ============================================================

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VTTS-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
